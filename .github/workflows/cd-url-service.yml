name: CD - URL Service

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: url-service
  ECS_SERVICE: UrlServiceStack-UrlServiceService
  ECS_CLUSTER: NetworkStack-EcsCluster
  CONTAINER_NAME: url-service
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/url-service
  IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      should_deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve HEAD^ to SHA
        id: parent_sha
        run: echo "parent_sha=$(git rev-parse HEAD^)" >> $GITHUB_OUTPUT

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.parent_sha.outputs.parent_sha }}
          ref: HEAD
          filters: |
            deploy:
              - "apps/url-service/**"
              - "packages/**"
              - ".github/workflows/cd-url-service.yml"

  deploy:
    name: Build & Deploy
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/url-service/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make script executable
        run: chmod +x ./scripts/deploy.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy using Script
        run: |
          ./scripts/deploy.sh \
            "${{ env.ECS_CLUSTER }}" \
            "${{ env.ECS_SERVICE }}" \
            "${{ env.CONTAINER_NAME }}" \
            "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            "${{ env.AWS_REGION }}" \
            "UrlService" \
            3000
